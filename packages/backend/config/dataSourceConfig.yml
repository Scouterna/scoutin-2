dataSources:
  groups:
    name:
      sv: ledare i din kår
      en: leader in your scout group
    provider: scoutnet
    subGroups:
      leader:
        name:
          sv: Ledare
          en: Leader
      leaderstaff:
        name:
          sv: Ledarfunktionär
          en: Leader functionary
    providerOptions:
      projectId: 56032
      includeIndividuals: false
      includeGroups: true
      # Actual real prod values:
      # subGroupConditions:
      #   leader:
      #     condition: |
      #       ${{
      #         participant.fee_id == 32341 || # Ledare
      #         participant.fee_id == 32349    # Ledare kortvecka (ons-lör)
      #       }}
      #   leaderstaff:
      #     condition: |
      #       ${{
      #         participant.fee_id == 32348 # Ledarfunktionär
      #       }}
      # Dev values:
      subGroupConditions:
        leader:
          condition: |
            ${{
              participant.fee_id == 31997 || # Ledare
              participant.fee_id == 32349    # Ledare kortvecka (ons-lör)
            }}
        leaderstaff:
          condition: |
            ${{
              participant.fee_id == 32012 # Ledarfunktionär
            }}
      keys:
        groups: ${SCOUTNET_GROUPS_GROUPS_KEY}
        participants: ${SCOUTNET_GROUPS_PARTICIPANTS_KEY}
        checkin: ${SCOUTNET_GROUPS_CHECKIN_KEY}
        questions: ${SCOUTNET_GROUPS_QUESTIONS_KEY}

