# Demokratijamboree 2026 check-in. Select with DEFAULT_STEP_CONFIG=stepConfig.dj26.yml.
#
# Check-in is marked here. While testing, keep DRY_RUN=true: the check-in is
# recorded locally but the write-back to Scoutnet is blocked and logged.
steps:
  - uses: base:identify
    id: identify
    with:
      scannerSide: bottom
      previewFields:
        # From the scoutnet:primaryGroup enricher (dataSourceConfig.dj26.yml).
        - label: { sv: Kår, en: Scout group }
          value: participant.metadata.group.name
        - label: { sv: Roll, en: Role }
          value: participant.subGroupName

  - uses: base:setActorAsSubject

  # Everything we have on the participant, for them to check before the voting
  # right is granted and the badge prints. Rows without a value are hidden
  # (meals for day participants, delegate number for non-delegates, ...).
  - uses: base:message
    id: confirmDetails
    with:
      title:
        sv: Stämmer dina uppgifter?
        en: Are your details correct?
      message:
        sv: Om något inte stämmer, gå till incheckningsdisken så hjälper vi dig.
        en: If anything is wrong, go to the check-in desk and we will help you.
      buttonText:
        sv: Ja, allt stämmer
        en: Yes, everything is correct
      allowCancel: true
      details:
        - rows:
          - label: { sv: Deltar som, en: Attending as }
            value: ${{ session.subjects[0].subGroupName }}
          - label: { sv: Roll, en: Role }
            value: ${{ session.subjects[0].metadata.badge.role }}
          - label: { sv: Ombudsnummer, en: Delegate number }
            value: ${{ session.subjects[0].metadata.badge.delegateNumber }}
          - label: { sv: Beredningsgrupp, en: Preparation group }
            # Delegates only (others get "Ej tilldelad" or similar).
            value: ${{ case(session.subjects[0].subGroup == 'delegate', session.subjects[0].metadata.badge.preparationGroup, '') }}
        # Filled row by row: the two lunches on top, dinner and its seating below.
        - title: { sv: Måltider, en: Meals }
          rows:
          - label: { sv: Lunch lördag, en: Lunch Saturday }
            value: ${{ session.subjects[0].metadata.badge.lunchSaturday }}
          - label: { sv: Lunch söndag, en: Lunch Sunday }
            value: ${{ session.subjects[0].metadata.badge.lunchSunday }}
          - label: { sv: Middag lördag, en: Dinner Saturday }
            value: ${{ session.subjects[0].metadata.badge.dinnerSaturday }}
          - label: { sv: Middagssittning, en: Dinner seating }
            value: ${{ session.subjects[0].metadata.badge.dinnerSeating }}

  - if: ${{ session.subjects[0].subGroup == 'delegate' }}
    uses: voteit:grantVoterRole
    id: voteit
    with:
      participantId: ${{ session.subjects[0].id }}
  # TODO: verification step (does not exist yet)

  # Turns the subject into the flat values the dj26 template takes. The
  # template decides what to show for each participant type.
  - uses: base:script
    id: badges
    with:
      variables:
        # There is always exactly one subject.
        subject: ${{ session.subjects[0] }}
      script: |
        // A text answer, or the choices joined; undefined when empty.
        const text = (answer) => {
          const joined = Array.isArray(answer) ? answer.join(", ") : answer;
          return (joined ?? "").trim() || undefined;
        };
        const answers = subject.metadata?.badge ?? {};
        // printer:print takes a list: one badge.
        return [
          {
            firstName: subject.firstName,
            lastName: subject.lastName,
            group: text(subject.metadata?.group?.name),
            memberNumber: subject.idInDataSource,
            participantType: subject.subGroup,
            participantSubtype: text(answers.role),
            delegateNumber: text(answers.delegateNumber),
            preparationGroup: text(answers.preparationGroup),
            lunchSaturday: text(answers.lunchSaturday),
            lunchSunday: text(answers.lunchSunday),
            dinnerSaturday: text(answers.dinnerSaturday),
          },
        ];

  - uses: printer:print
    id: printBadges
    with:
      template: dj26
      values: ${{ steps.badges.outputs.result }}
      behavior: queue

  - uses: base:markConfirmedCheckedIn
    required: true

  # Placeholder text. Delegates whose VoteIT grant went through also get a line
  # about their voting rights.
  - uses: base:message
    with:
      title:
        sv: Klart!
        en: Done!
      message:
        sv: "Du är incheckad${{ case(steps.voteit.outputs.status == 'granted' || steps.voteit.outputs.status == 'alreadyGranted', ' och din rösträtt är registrerad', '') }}. Hämta din namnskylt och följ skyltarna vidare."
        en: "You are checked in${{ case(steps.voteit.outputs.status == 'granted' || steps.voteit.outputs.status == 'alreadyGranted', ' and your voting rights are registered', '') }}. Pick up your name badge and follow the signs."
